<!DOCTYPE html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>MediaForgeLab · Pessoal</title><link rel="icon" type="image/png" href="brand.png?v=1"><link rel="stylesheet" href="personal.css?v=4"></head><body>
<div id="library"><header><img src="brand.png" alt=""><h1>MediaForgeLab <small>Pessoal · v4</small></h1><button id="home">← Voltar à aplicação</button></header>
<nav id="tabs"><button data-view="all">Todos</button><button data-view="photo">Fotografias</button><button data-view="video">Vídeos</button><button data-view="albums">Álbuns</button><button data-view="favorites">★ Favoritos</button><button data-view="continue">Continuar a ver</button></nav>
<div class="tools"><input id="search" placeholder="Pesquisar por nome ou pasta" aria-label="Pesquisar"><button id="search-keyboard">Teclado</button><select id="year" aria-label="Ano"><option value="">Todos os anos</option></select><select id="folder" aria-label="Pasta"><option value="">Todas as pastas</option></select></div>
<div class="tools"><button id="connect">Ligar OneDrive</button><button id="source">Escolher pasta</button><button id="scan">↻ Atualizar biblioteca pessoal</button><button id="new-album">+ Álbum</button><button id="rename-album">Renomear álbum</button><button id="delete-album">Apagar álbum</button><button id="disconnect">Desligar conta</button></div>
<p id="cloud-status" role="status"></p><h2 id="heading">A sua biblioteca pessoal</h2><p id="status" role="status"></p><div class="selection-tools"><button id="item-options" disabled>☰ Opções do item</button><span>Setas: escolher conteúdo · OK: abrir · MENU / INFO: opções</span></div><div id="items"></div><footer><button id="prev">← Anterior</button><span id="page"></span><button id="next">Seguinte →</button></footer><p class="hint">Setas: navegar · OK: escolher · BACK: voltar · CH +/−: página</p></div>
<div id="dialog" class="overlay"><div class="panel"><h2 id="dialog-title"></h2><p id="dialog-message"></p><div id="dialog-body"></div><button id="dialog-close">← Fechar</button></div></div>
<div id="viewer" class="overlay"><img id="photo" alt=""><object id="avplayer" type="application/avplayer"></object><video id="video" playsinline></video><div id="viewer-bar"><h2 id="view-title"></h2><p id="view-status" role="status"></p><div id="timeline"><label for="seek-position">Posição no vídeo <span id="seek-label"></span></label><input id="seek-position" type="range" min="0" max="0" step="1" value="0" disabled aria-label="Posição no vídeo"><small id="seek-help">Arraste para escolher · No comando: ←/→ escolher, OK confirmar</small></div><button id="close-viewer">← Biblioteca</button><button id="photo-prev">← Foto</button><button id="photo-next">Foto →</button><button id="slideshow">▶ Apresentação</button><button id="pause">Ⅱ Pausa</button><button id="rewind">−10 s</button><button id="forward">+10 s</button><span id="clock"></span></div></div>
<script src="config.js"></script><script src="player.js"></script><script src="personal.js?v=4"></script></body></html>
