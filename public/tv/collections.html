<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>MediaForgeLab · Coleções</title><link rel="icon" href="brand.png"><link rel="stylesheet" href="collections.css?v=8"></head><body>
<div id="library"><header><img src="brand.png" alt=""><div><h1>Coleções</h1><p>Os teus vídeos, por temas e listas <small>· v8</small></p></div><button id="home">← Biblioteca</button></header>
<div class="layout"><aside><nav><button id="all" class="active">▣ Todos os vídeos</button><button id="favorites">★ Favoritos</button><button id="continue">↻ Continuar a ver</button><button id="categories">▤ Categorias</button><button id="playlists">☷ Listas de reprodução</button></nav><div class="manage"><button id="tags-manage">◇ Gerir etiquetas</button><button id="add">＋ Guardar vídeo</button><button id="import">↓ Importar links</button></div><p class="hint">Os mesmos vídeos e listas em todos os dispositivos.</p></aside>
<main><div class="filters"><input id="search" type="search" placeholder="Pesquisar vídeos…" aria-label="Pesquisar vídeos"><select id="category" aria-label="Categoria"><option value="">Todas as categorias</option></select><select id="tag" aria-label="Etiqueta"><option value="">Todas as etiquetas</option></select><select id="platform" aria-label="Origem"><option value="">Todas as origens</option><option value="youtube">YouTube</option><option value="facebook">Facebook</option><option value="vimeo">Vimeo</option><option value="instagram">Instagram</option><option value="tiktok">TikTok</option><option value="direct">Vídeo direto</option><option value="link">Outros links</option></select></div>
<div class="heading"><h2 id="heading">Todos os vídeos</h2><button id="play-sequence" hidden>▶ Reproduzir lista</button></div><p id="status" role="status"></p><div id="items"></div><footer><button id="prev">← Anterior</button><span id="page"></span><button id="next">Seguinte →</button></footer></main></div></div>
<div id="viewer" class="overlay" style="display:none"><div class="viewer-head"><h2 id="play-title"></h2><button id="close-viewer">← Coleções</button></div><div id="screen"><object id="avplayer" type="application/avplayer"></object><video id="video" controls playsinline></video><div id="external"></div></div><div class="play-controls"><p id="play-status" role="status"></p><div class="row"><button id="previous-video">← Anterior</button><select id="queue" aria-label="Vídeo da lista"></select><button id="next-video">Seguinte →</button></div><div class="row"><button id="resume">▶ Retomar</button><button id="pause">Ⅱ Pausa</button><a id="original" target="_blank" rel="noopener noreferrer">Abrir na origem ↗</a><button id="detach" hidden>▣ Destacar</button><button id="fullscreen">⛶ Ecrã inteiro</button></div><label id="facebook-layout-row" class="hint" style="display:none">Enquadramento <select id="facebook-layout" aria-label="Enquadramento do vídeo Facebook"><option value="0">Automático</option><option value="0.5625">Vertical</option><option value="1.7777777778">Horizontal</option><option value="1">Quadrado</option></select></label><div id="seek-box"><input id="timeline" type="range" min="0" max="1" value="0" step="1" aria-label="Posição no vídeo" disabled><span id="time"></span></div><p id="compatibility" class="hint"></p></div></div>
<div id="dialog" class="modal" style="display:none" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><section><div class="heading"><h2 id="dialog-title"></h2><button id="dialog-close">✕ Fechar</button></div><p id="dialog-message" role="status"></p><div id="dialog-body"></div></section></div>
<div id="keyboard" class="modal" style="display:none"><section><h2>Escrever</h2><p id="keyboard-value"></p><div id="keyboard-keys"></div></section></div>
<script src="config.js"></script><script src="player.js"></script><script src="browse-prefs.js?v=1"></script><script src="floating-player.js?v=1"></script><script src="collections.js?v=8"></script></body></html>
